<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — an original open-world crime game</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAJklEQVR4nGPgElEgCTEA8f8tDESiAdGA6Whqaxh1Ek2cRBsNJCEAnawnMMIXBxIAAAAASUVORK5CYII=">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a1420; }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  /* r9: lifted clear of the canvas HUD bar at the bottom of the screen,
     so the hint never overlaps the mission / weapon line. */
  #hint { position: fixed; left: 12px; bottom: 104px; color: #fff; font: 13px sans-serif; opacity: 0.65; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">Solmar Heat — WASD to walk &amp; drive, E to take a car, mouse to aim, F to shoot, S to save.</div>
<script type="module" src="./src/main.js"></script>
</body>
