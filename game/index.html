<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — Costa Solmar Open World</title>
<meta name="description" content="Solmar Heat: an original open-world crime game. Explore Costa Solmar on foot and by car, steal cars, outrun the SCPD, and run five story missions.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Heat: an open-world crime game in Costa Solmar. Drive, steal cars, outrun the police and run missions for Juno and Marco."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
