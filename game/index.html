<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c1016;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  canvas {
    width: 1280px;
    height: 720px;
    background: #7fae5a;
    display: block;
    cursor: crosshair;
  }
  #selftest {
    position: fixed;
    left: 8px;
    bottom: 8px;
    max-width: 640px;
    white-space: pre-wrap;
    color: #e8f0e8;
    background: rgba(10, 14, 18, 0.85);
    padding: 10px 12px;
    border-radius: 8px;
    font: 12px/1.5 monospace;
    display: none;
  }
  #selftest:not(:empty) { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<div id="selftest"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
